name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      # Analyzers run as part of the build; TreatWarningsAsErrors fails it on any finding.
      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Check formatting
        run: dotnet format --verify-no-changes --no-restore

      # Functional tests start PostgreSQL in Docker through Aspire; the runner has Docker.
      - name: Test with coverage
        run: >
          dotnet test --no-build --configuration Release
          --results-directory TestResults
          --coverlet --coverlet-output-format cobertura

      - name: Build coverage report
        if: always()
        uses: danielpalme/ReportGenerator-GitHub-Action@5
        with:
          reports: TestResults/**/*.cobertura.xml
          targetdir: coverage-report
          reporttypes: HtmlInline;MarkdownSummaryGithub

      - name: Add coverage summary to the run
        if: always()
        run: cat coverage-report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage-report
          if-no-files-found: ignore
